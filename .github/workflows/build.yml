name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup project files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Installe le NDK avant Gradle, avec 3 tentatives, pour éviter
      # un téléchargement coupé pendant "flutter build apk".
      - name: Install Android NDK (avec nouvelle tentative)
        run: |
          for i in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"; then
              exit 0
            fi
            echo "Tentative $i échouée, nouvelle tentative dans 15 s..."
            sleep 15
          done
          echo "Impossible d'installer le NDK après 3 tentatives"
          exit 1

      - name: Generate Flutter scaffold (android folder)
        run: flutter create . --project-name market_app --org com.example --platforms=android

      - name: Restore project files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib ./
          cp /tmp/backup/pubspec.yaml ./

      - name: Get Flutter dependencies
        run: flutter pub get

      # Force compileSdk 36 pour TOUS les sous-projets
      # (ignoré si android/build.gradle n'existe pas, ex. Flutter récent en .kts)
      - name: Fix Android compileSdk for all modules
        run: |
          ROOT_GRADLE="android/build.gradle"
          if [ -f "$ROOT_GRADLE" ]; then
            cat >> "$ROOT_GRADLE" <<'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
          else
            echo "android/build.gradle introuvable : étape ignorée"
            ls android
          fi

      - name: Disable Lint for release build
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/^android {/a\    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }' "$GRADLE_FILE"
          else
            echo "android/app/build.gradle introuvable : étape ignorée"
            ls android/app
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
