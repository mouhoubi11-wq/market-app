name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup project files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Flutter scaffold (android folder)
        run: flutter create . --project-name market_app --org com.example --platforms=android

      - name: Restore project files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib ./
          cp /tmp/backup/pubspec.yaml ./

      - name: Get Flutter dependencies
        run: flutter pub get

      # 👇 CORRECTION RENFORCÉE : Force compileSdk 36 pour TOUS les modules
      - name: Fix Android compileSdk for all modules
        run: |
          # 1. Modifie le build.gradle du module "app"
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' "$APP_GRADLE"
            sed -i 's/compileSdk .*/compileSdk 36/' "$APP_GRADLE"
          fi
          APP_GRADLE_KTS="android/app/build.gradle.kts"
          if [ -f "$APP_GRADLE_KTS" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' "$APP_GRADLE_KTS"
          fi

          # 2. Modifie le build.gradle RACINE pour forcer tous les sous-projets (plugins)
          ROOT_GRADLE="android/build.gradle"
          if [ -f "$ROOT_GRADLE" ]; then
            # Ajoute un bloc subprojects qui force compileSdk à 36
            cat >> "$ROOT_GRADLE" <<'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
          fi

      - name: Disable Lint for release build
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/^android {/a\    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }' "$GRADLE_FILE"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
