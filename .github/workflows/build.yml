name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Dernière version stable de Flutter (le thème de l'appli demande Flutter 3.27 ou plus).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      # Si le dossier android/ n'est pas dans le dépôt, on le génère.
      - name: Créer le dossier android si absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name market_app --org com.marche .
          fi

      # Sans la permission INTERNET dans le manifeste, l'APK final n'a AUCUN accès au réseau.
      # Cette étape l'ajoute (et la requête « tel: » pour le bouton Appeler) si elles manquent.
      - name: Autoriser Internet dans le manifeste Android
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                         s, count=1)
          if 'android:scheme="tel"' not in s:
              intent = ('        <intent>\n'
                        '            <action android:name="android.intent.action.VIEW"/>\n'
                        '            <data android:scheme="tel"/>\n'
                        '        </intent>\n')
              if '</queries>' in s:
                  s = s.replace('</queries>', intent + '    </queries>', 1)
              else:
                  s = s.replace('</manifest>',
                                '    <queries>\n' + intent + '    </queries>\n</manifest>', 1)
          s = s.replace('android:label="market_app"', 'android:label="Marché"')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: marche-apk
          path: build/app/outputs/flutter-apk/app-release.apk
