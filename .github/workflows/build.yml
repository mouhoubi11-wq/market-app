name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup project files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android NDK (avec nouvelle tentative)
        run: |
          for i in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"; then
              exit 0
            fi
            echo "Tentative $i échouée, nouvelle tentative dans 15 s..."
            sleep 15
          done
          echo "Impossible d'installer le NDK après 3 tentatives"
          exit 1

      - name: Generate Flutter scaffold (android folder)
        run: flutter create . --project-name market_app --org com.example --platforms=android

      - name: Restore project files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib ./
          cp /tmp/backup/pubspec.yaml ./

      - name: Get Flutter dependencies
        run: flutter pub get

      # Script Gradle d'initialisation (marche avec .gradle ET .gradle.kts) :
      # 1) force compileSdk 36 sur tous les plugins Android
      # 2) désactive Android Lint "vital" qui plante pendant le build release
      - name: Gradle init script (compileSdk + désactiver lint)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/fix-build.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.library")) {
                      project.android.compileSdk = 36
                  }
              }
              tasks.configureEach { task ->
                  if (task.name.startsWith("lintVital")) {
                      task.enabled = false
                  }
              }
          }
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
