name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup project files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Flutter scaffold (android folder)
        run: flutter create . --project-name market_app --org com.example --platforms=android

      - name: Restore project files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib ./
          cp /tmp/backup/pubspec.yaml ./

      - name: Get Flutter dependencies
        run: flutter pub get

      # 👇 LA CORRECTION EST ICI : on passe à compileSdk 36
      - name: Fix Android compileSdk
        run: |
          GRADLE_FILE="android/app/build.gradle"
          GRADLE_KTS_FILE="android/app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
            echo "Mise a jour de build.gradle..."
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' "$GRADLE_FILE"
            sed -i 's/compileSdk .*/compileSdk 36/' "$GRADLE_FILE"
          elif [ -f "$GRADLE_KTS_FILE" ]; then
            echo "Mise a jour de build.gradle.kts..."
            sed -i 's/compileSdk = .*/compileSdk = 36/' "$GRADLE_KTS_FILE"
          fi
          echo "--- Verification du compileSdk ---"
          grep -r "compileSdk" android/app/ || true

      - name: Disable Lint for release build
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/^android {/a\    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }' "$GRADLE_FILE"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
