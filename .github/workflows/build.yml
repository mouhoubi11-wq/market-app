name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup project files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Flutter scaffold (android folder)
        run: flutter create . --project-name market_app --org com.example --platforms=android

      - name: Restore project files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib ./
          cp /tmp/backup/pubspec.yaml ./

      - name: Get Flutter dependencies
        run: flutter pub get

      # 👇 CORRECTION DÉFINITIVE : Force compileSdk 36 et Java 17 pour TOUS les sous-projets
      - name: Fix Android compileSdk for all modules
        run: |
          ROOT_GRADLE="android/build.gradle"
          if [ -f "$ROOT_GRADLE" ]; then
            echo "" >> "$ROOT_GRADLE"
            echo "subprojects {" >> "$ROOT_GRADLE"
            echo "    afterEvaluate { project ->" >> "$ROOT_GRADLE"
            echo "        if (project.hasProperty('android')) {" >> "$ROOT_GRADLE"
            echo "            project.android {" >> "$ROOT_GRADLE"
            echo "                compileSdkVersion 36" >> "$ROOT_GRADLE"
            echo "                compileOptions {" >> "$ROOT_GRADLE"
            echo "                    sourceCompatibility JavaVersion.VERSION_17" >> "$ROOT_GRADLE"
            echo "                    targetCompatibility JavaVersion.VERSION_17" >> "$ROOT_GRADLE"
            echo "                }" >> "$ROOT_GRADLE"
            echo "            }" >> "$ROOT_GRADLE"
            echo "        }" >> "$ROOT_GRADLE"
            echo "        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {" >> "$ROOT_GRADLE"
            echo "            kotlinOptions {" >> "$ROOT_GRADLE"
            echo "                jvmTarget = JavaVersion.VERSION_17.toString()" >> "$ROOT_GRADLE"
            echo "            }" >> "$ROOT_GRADLE"
            echo "        }" >> "$ROOT_GRADLE"
            echo "    }" >> "$ROOT_GRADLE"
            echo "}" >> "$ROOT_GRADLE"
            echo "subprojects { project.evaluationDependsOn(':app') }" >> "$ROOT_GRADLE"
          fi

      - name: Disable Lint for release build
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/^android {/a\    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }' "$GRADLE_FILE"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
