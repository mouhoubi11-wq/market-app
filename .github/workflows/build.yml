name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup project files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Flutter scaffold (android folder)
        run: flutter create . --project-name market_app --org com.example --platforms=android

      - name: Restore project files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib ./
          cp /tmp/backup/pubspec.yaml ./

      - name: Get Flutter dependencies
        run: flutter pub get

      # 👇 CORRECTION DÉFINITIVE : Force compileSdk 36 pour tous les sous-projets
      - name: Fix Android compileSdk for all modules
        run: |
          # 1. Modifie le fichier build.gradle de l'application
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' "$APP_GRADLE"
            sed -i 's/compileSdk .*/compileSdk 36/' "$APP_GRADLE"
          fi
          APP_GRADLE_KTS="android/app/build.gradle.kts"
          if [ -f "$APP_GRADLE_KTS" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' "$APP_GRADLE_KTS"
          fi

          # 2. Modifie le fichier build.gradle RACINE pour forcer les sous-projets
          ROOT_GRADLE="android/build.gradle"
          if [ -f "$ROOT_GRADLE" ]; then
            # Supprime l'ancien bloc subprojects s'il existe pour éviter les doublons
            sed -i '/subprojects {/,/^}/d' "$ROOT_GRADLE"
            # Ajoute le nouveau bloc corrigé à la fin du fichier
            echo "" >> "$ROOT_GRADLE"
            echo "subprojects {" >> "$ROOT_GRADLE"
            echo "    afterEvaluate { project ->" >> "$ROOT_GRADLE"
            echo "        if (project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')) {" >> "$ROOT_GRADLE"
            echo "            project.android {" >> "$ROOT_GRADLE"
            echo "                compileSdkVersion 36" >> "$ROOT_GRADLE"
            echo "                buildToolsVersion '36.0.0'" >> "$ROOT_GRADLE"
            echo "            }" >> "$ROOT_GRADLE"
            echo "        }" >> "$ROOT_GRADLE"
            echo "    }" >> "$ROOT_GRADLE"
            echo "}" >> "$ROOT_GRADLE"
          fi

      - name: Disable Lint for release build
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/^android {/a\    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }' "$GRADLE_FILE"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
