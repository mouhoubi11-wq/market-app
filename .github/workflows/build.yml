      - name: Désactiver lintVital (anti-crash)
        run: |
          BUILD_GRADLE=android/app/build.gradle.kts
          if ! grep -q "isCheckReleaseBuilds" "$BUILD_GRADLE"; then
            python3 - <<'PY'
          p = 'android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()

          # Configuration adaptée pour un fichier .kts
          lint_config = (
              '    lint {\n'
              '        isCheckReleaseBuilds = false\n'
              '        abortOnError = false\n'
              '    }\n'
          )

          marker = 'android {'
          idx = s.find(marker)
          if idx != -1:
              insert_pos = idx + len(marker)
              s = s[:insert_pos] + '\n' + lint_config + s[insert_pos:]
              open(p, 'w', encoding='utf-8').write(s)
              print("✅ Configuration lintVital (kts) ajoutée.")
          else:
              print("⚠️ Impossible de trouver le bloc 'android {'.")
          PY
          fi
          echo "=== Contenu de build.gradle.kts (extrait) ==="
          head -40 "$BUILD_GRADLE"
